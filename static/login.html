<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScreenSender — sign in</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #111; color: #eee; font: 17px system-ui, sans-serif; padding: 16px;
  }
  form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0 0 6px; font-size: 22px; font-weight: 600; text-align: center; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: #aaa; }
  input {
    width: 100%; padding: 12px; font: inherit; color: #fff;
    background: #222; border: 1px solid #444; border-radius: 8px;
  }
  input:focus { outline: none; border-color: #3a9be8; }
  .pw { position: relative; }
  .pw input { padding-right: 52px; }
  #eye {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    width: 44px; height: 40px; border: 0; background: none; color: #aaa;
    font-size: 20px; cursor: pointer;
  }
  #eye.on { color: #3a9be8; }
  button[type=submit] {
    margin-top: 6px; padding: 13px; font: inherit; font-weight: 600; color: #fff;
    background: #0078d7; border: 0; border-radius: 8px;
  }
  #error { color: #ff6b6b; text-align: center; font-size: 15px; display: none; }
</style>
</head>
<body>
<form method="post" action="login">
  <h1>ScreenSender</h1>
  <div id="error" data-t="error">Wrong username or password</div>
  <label><span data-t="username">Username</span>
    <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off"
           spellcheck="false" required autofocus>
  </label>
  <label><span data-t="password">Password</span>
    <span class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button id="eye" type="button" aria-label="Show password">👁</button>
    </span>
  </label>
  <button type="submit" data-t="signIn">Sign in</button>
</form>
<script>
  // Russian when the browser prefers Russian, English otherwise.
  const LANG = (navigator.languages?.[0] || navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  const TEXT = {
    en: { title: 'ScreenSender — sign in', error: 'Wrong username or password', username: 'Username',
          password: 'Password', signIn: 'Sign in', show: 'Show password', hide: 'Hide password' },
    ru: { title: 'ScreenSender — вход', error: 'Неверный логин или пароль', username: 'Логин',
          password: 'Пароль', signIn: 'Войти', show: 'Показать пароль', hide: 'Скрыть пароль' },
  };
  const tr = key => TEXT[LANG][key];
  document.documentElement.lang = LANG;
  document.title = tr('title');
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });

  if (new URLSearchParams(location.search).has('error'))
    document.getElementById('error').style.display = 'block';
  const pw = document.getElementById('password');
  const eye = document.getElementById('eye');
  eye.setAttribute('aria-label', tr('show'));
  eye.onclick = () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.setAttribute('aria-label', tr(show ? 'hide' : 'show'));
    pw.focus();
  };
</script>
</body>
</html>
