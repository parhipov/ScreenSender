<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
<title>ScreenSender</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; font-family: system-ui, sans-serif; touch-action: manipulation; }
  /* The picture is zoomed and panned by the page itself (CSS transform on #stage), so the
     toolbar stays put and the server can be told which part of the screen is visible. */
  #view { flex: 1; min-height: 0; position: relative; overflow: hidden; touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  #stage canvas {
    position: absolute; left: 0; top: 0;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #cursor { pointer-events: none; }
  #bar {
    position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 2;
    font-size: 14px;
  }
  #bar button {
    background: rgba(40,40,40,.75); color: #fff; border: 1px solid #666;
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  #bar button.on { background: rgba(0,120,215,.85); border-color: #3a9be8; }
  #bar.hidden button:not(#toggleBar) { display: none; }
  #bar.hidden ~ #status { display: none; }
  #status {
    position: fixed; left: 8px; top: 8px; color: #fff; z-index: 2;
    font-size: 13px; background: rgba(0,0,0,.6); font-variant-numeric: tabular-nums;
    padding: 3px 8px; border-radius: 4px; pointer-events: none; white-space: nowrap;
  }
  #status.hint { background: rgba(0,120,215,.85); }
  .ripple {
    position: fixed; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; border: 2px solid #fff; pointer-events: none; z-index: 3;
    animation: ripple .4s ease-out forwards;
  }
  .ripple.right { border-color: #ffb000; }
  @keyframes ripple { to { transform: scale(1.8); opacity: 0; } }

  #kb {
    display: none; flex-direction: column; gap: 6px; padding: 6px;
    background: #1b1b1b; border-top: 1px solid #333;
  }
  #kb.open { display: flex; }
  #kbInput {
    width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; /* 16px: no iOS auto-zoom */
    color: #fff; background: #2a2a2a; border: 1px solid #444; border-radius: 6px;
  }
  #kbInput:focus { outline: none; border-color: #3a9be8; }
  .keys { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
  .keys::-webkit-scrollbar { display: none; }
  .keys button {
    flex: 0 0 auto; min-width: 42px; padding: 9px 10px; font-size: 15px;
    color: #fff; background: #333; border: 1px solid #4a4a4a; border-radius: 6px;
  }
  .keys button:active { background: #555; }
  .keys button.mod.on { background: #0078d7; border-color: #3a9be8; }
</style>
</head>
<body>
<div id="view">
  <div id="stage">
    <canvas id="pic"></canvas>
    <canvas id="cursor"></canvas>
  </div>
</div>
<div id="kb">
  <input id="kbInput" type="text" placeholder="Type here: the text goes straight to the PC"
         autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
  <div class="keys">
    <button class="mod" data-mod="ctrl">Ctrl</button>
    <button class="mod" data-mod="alt">Alt</button>
    <button class="mod" data-mod="shift">Shift</button>
    <button class="mod" data-mod="win">Win</button>
    <button data-key="esc">Esc</button>
    <button data-key="tab">Tab</button>
    <button data-key="backspace">⌫</button>
    <button data-key="delete">Del</button>
    <button data-key="enter">Enter ⏎</button>
  </div>
  <div class="keys">
    <button data-key="left">←</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="right">→</button>
    <button data-key="home">Home</button>
    <button data-key="end">End</button>
    <button data-key="pageup">PgUp</button>
    <button data-key="pagedown">PgDn</button>
    <button data-key="tab" data-mods="alt">Alt+Tab</button>
    <button data-key="c" data-mods="ctrl" data-t="copy">Copy</button>
    <button id="pastePhone" data-t="fromPhone">📋 From phone</button>
    <button data-key="v" data-mods="ctrl">Ctrl+V</button>
    <button data-key="z" data-mods="ctrl" data-t="undo">Undo</button>
    <button data-key="f5">F5</button>
  </div>
</div>
<div id="bar">
  <button id="monBtn" style="display:none"></button>
  <button id="qBtn" title="Picture quality"></button>
  <button id="clicks" class="on" data-t="clicks">Clicks</button>
  <button id="kbBtn">⌨</button>
  <button id="fs">⛶</button>
  <button id="toggleBar">☰</button>
</div>
<div id="status" data-t="connecting">Connecting…</div>

<script>
// ---- interface language: Russian when the browser prefers Russian, English otherwise
const LANG = (navigator.languages?.[0] || navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';
const TEXT = {
  en: {
    connecting: 'Connecting…', clicks: 'Clicks', copy: 'Copy', undo: 'Undo', fromPhone: '📋 From phone',
    typeHere: 'Type here: the text goes straight to the PC', quality: 'Picture quality',
    low: 'Low', normal: 'Normal', high: 'Sharp', fps: 'fps', kbs: 'KB/s', allMonitors: 'all',
    noConnection: 'No connection, reconnecting…', monitorFailed: 'Monitor not switched',
    clickFailed: 'Click not sent', scrollFailed: 'Scroll not sent', keysFailed: 'Keys not sent',
    pasteHint: 'Long-press the text field → Paste',
  },
  ru: {
    connecting: 'Подключение…', clicks: 'Клики', copy: 'Копир.', undo: 'Отмена', fromPhone: '📋 С телефона',
    typeHere: 'Печатайте — текст сразу уходит на ПК', quality: 'Качество картинки',
    low: 'Эконом', normal: 'Обычно', high: 'Чётко', fps: 'к/с', kbs: 'КБ/с', allMonitors: 'все',
    noConnection: 'Нет связи, переподключение…', monitorFailed: 'Монитор не переключён',
    clickFailed: 'Клик не отправлен', scrollFailed: 'Прокрутка не отправлена', keysFailed: 'Клавиши не отправлены',
    pasteHint: 'Удерживайте поле ввода → «Вставить»',
  },
};
const tr = key => TEXT[LANG][key];
document.documentElement.lang = LANG;
document.querySelectorAll('[data-t]').forEach(el => { el.textContent = tr(el.dataset.t); });

const view = document.getElementById('view');
const stage = document.getElementById('stage');
const pic = document.getElementById('pic');
const cursorLayer = document.getElementById('cursor');
const ctx = pic.getContext('2d');
const cctx = cursorLayer.getContext('2d');
const statusEl = document.getElementById('status');
const clicksBtn = document.getElementById('clicks');
const kbBtn = document.getElementById('kbBtn');
let clicksOn = true;
let inputAllowed = false;
let captureName = '';

// ---- status line: a hint for a few seconds, otherwise the traffic counters
let hintUntil = 0;
function hint(text) {
  statusEl.textContent = text;
  statusEl.classList.add('hint');
  hintUntil = Date.now() + 3000;
}
const STATS_WINDOW = 3000;
const stats = [];   // [time, bytes] of recent updates
function countUpdate(bytes) {
  stats.push([Date.now(), bytes]);
}
function showStats() {
  if (Date.now() < hintUntil) return;
  const now = Date.now();
  while (stats.length && stats[0][0] < now - STATS_WINDOW) stats.shift();
  const secs = STATS_WINDOW / 1000;
  const fps = (stats.length / secs).toFixed(1);
  const kbs = Math.round(stats.reduce((s, [, b]) => s + b, 0) / secs / 1024);
  statusEl.classList.remove('hint');
  statusEl.textContent = `${captureName} ${fps} ${tr('fps')} · ${kbs} ${tr('kbs')}`;
}
setInterval(showStats, 1000);

// ---- quality preset (sent with every request; the server picks the compression)
const QUALITY_LABELS = { low: tr('low'), normal: tr('normal'), high: tr('high') };
const QUALITY_ORDER = ['low', 'normal', 'high'];
const qBtn = document.getElementById('qBtn');
qBtn.title = tr('quality');
let quality = 'normal';
try { if (QUALITY_LABELS[localStorage.getItem('quality')]) quality = localStorage.getItem('quality'); } catch {}
function showQuality() { qBtn.textContent = '🎚 ' + QUALITY_LABELS[quality]; }
showQuality();
qBtn.onclick = () => {
  quality = QUALITY_ORDER[(QUALITY_ORDER.indexOf(quality) + 1) % QUALITY_ORDER.length];
  showQuality();
  try { localStorage.setItem('quality', quality); } catch {}
};

// ---- zoom and pan: the stage (both canvases) is moved with a CSS transform.
// fit: where the picture sits inside the stage at zoom 1 (letterboxed), in CSS pixels.
const MAX_ZOOM = 8;
let fit = { w: 0, h: 0, ox: 0, oy: 0 };
let zoom = 1, tx = 0, ty = 0;
let haveFrame = false;

function layout() {
  const vw = view.clientWidth, vh = view.clientHeight;
  if (!haveFrame || !vw || !vh) return;
  const s = Math.min(vw / pic.width, vh / pic.height);
  fit = { w: pic.width * s, h: pic.height * s, ox: (vw - pic.width * s) / 2, oy: (vh - pic.height * s) / 2 };
  for (const c of [pic, cursorLayer]) {
    c.style.left = fit.ox + 'px';
    c.style.top = fit.oy + 'px';
    c.style.width = fit.w + 'px';
    c.style.height = fit.h + 'px';
  }
  applyTransform();
}
function clampOffset(t, size, offset, viewSize) {
  // Keeps the picture covering the view when it is larger than it, centred otherwise.
  const shown = size * zoom;
  if (shown <= viewSize) return (viewSize - shown) / 2 - offset * zoom;
  return Math.min(-offset * zoom, Math.max(viewSize - (offset + size) * zoom, t));
}
function applyTransform() {
  tx = clampOffset(tx, fit.w, fit.ox, view.clientWidth);
  ty = clampOffset(ty, fit.h, fit.oy, view.clientHeight);
  stage.style.transform = `translate(${tx}px, ${ty}px) scale(${zoom})`;
}
function resetZoom() {
  zoom = 1; tx = 0; ty = 0;
  applyTransform();
}
new ResizeObserver(layout).observe(view);

// Maps a viewport point to 0..1 coordinates on the picture.
function toImageCoords(clientX, clientY) {
  if (!haveFrame) return null;
  const r = view.getBoundingClientRect();
  const sx = (clientX - r.left - tx) / zoom, sy = (clientY - r.top - ty) / zoom;
  const x = (sx - fit.ox) / fit.w, y = (sy - fit.oy) / fit.h;
  return (x < 0 || x > 1 || y < 0 || y > 1) ? null : { x, y };
}
// The visible part of the picture in picture pixels; null when all of it is on screen.
function visibleRect() {
  if (!haveFrame || zoom <= 1.01) return null;
  const vw = view.clientWidth, vh = view.clientHeight;
  const px = s => (s - fit.ox) / fit.w * pic.width, py = s => (s - fit.oy) / fit.h * pic.height;
  const x0 = Math.max(0, Math.floor(px(-tx / zoom))), y0 = Math.max(0, Math.floor(py(-ty / zoom)));
  const x1 = Math.min(pic.width, Math.ceil(px((vw - tx) / zoom)));
  const y1 = Math.min(pic.height, Math.ceil(py((vh - ty) / zoom)));
  return [x0, y0, Math.max(0, x1 - x0), Math.max(0, y1 - y0)];
}

// ---- frames: request the next update only after the previous one has been drawn,
// so a slow connection lowers the frame rate instead of piling up delay.
// The server remembers what this viewer has, and sends only the tiles it lacks
// inside the visible area. When the area changes, the waiting request is replaced.
const sleep = ms => new Promise(r => setTimeout(r, ms));
const viewerId = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
let reqNo = 0, drawnReq = 0, epoch = 0;   // drawnReq: request whose update was drawn last
let inflight = null;      // AbortController of the request in flight
let inflightView = '';    // the view it was made with

function viewChanged() {
  const v = (visibleRect() || []).join();
  if (v !== inflightView) inflight?.abort();
}

function decodeImage(bytes) {
  const type = bytes[0] === 0xFF ? 'image/jpeg' : 'image/webp';
  const blob = new Blob([bytes], { type });
  if (window.createImageBitmap) return createImageBitmap(blob);
  return new Promise((resolve, reject) => {
    const im = new Image();
    const url = URL.createObjectURL(blob);
    im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
    im.onerror = reject;
    im.src = url;
  });
}

// The PC pointer lives on its own transparent canvas, so drawing it never touches the picture.
const CURSOR_R = 6;
let lastCursor = null;
function drawCursor(pos) {
  const s = CURSOR_R + 3;
  if (lastCursor) cctx.clearRect(lastCursor[0] - s, lastCursor[1] - s, 2 * s, 2 * s);
  lastCursor = pos;
  if (!pos) return;
  cctx.beginPath();
  cctx.arc(pos[0], pos[1], CURSOR_R - 1, 0, 2 * Math.PI);
  cctx.fillStyle = '#ff2828';
  cctx.fill();
  cctx.lineWidth = 2;
  cctx.strokeStyle = '#fff';
  cctx.stroke();
}

// Update format: 4-byte header length, JSON header, then the picture pieces back to back.
async function applyUpdate(buf) {
  const headLen = new DataView(buf).getUint32(0);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, headLen)));
  let offset = 4 + headLen;
  const pieces = await Promise.all(meta.rects.map(([x, y, len]) => {
    const bytes = new Uint8Array(buf, offset, len);
    offset += len;
    return decodeImage(bytes).then(bmp => ({ x, y, bmp }));
  }));
  // Everything is decoded first and painted in one go, so a frame never shows half-updated.
  if (meta.epoch !== epoch || pic.width !== meta.width || pic.height !== meta.height) {
    pic.width = cursorLayer.width = meta.width;   // resizing also clears the canvases
    pic.height = cursorLayer.height = meta.height;
    lastCursor = null;
    epoch = meta.epoch;
    haveFrame = true;
    resetZoom();
    layout();
  }
  for (const p of pieces) {
    ctx.drawImage(p.bmp, p.x, p.y);
    p.bmp.close?.();
  }
  drawCursor(meta.cursor);
  drawnReq = meta.req;
  captureName = meta.capture;
  if (meta.monitor !== monitor) { monitor = meta.monitor; refreshMonitor(); }
}

async function frameLoop() {
  for (;;) {
    if (document.hidden) { await sleep(500); continue; }   // tab in background: no traffic
    const params = new URLSearchParams({ v: viewerId, r: ++reqNo, ack: drawnReq, q: quality });
    const vr = visibleRect();
    if (vr) params.set('view', vr.join());
    inflightView = (vr || []).join();
    inflight = new AbortController();
    try {
      const r = await fetch('frame?' + params, { cache: 'no-store', signal: inflight.signal });
      if (r.status === 401) { location.href = 'login'; return; }  // session expired
      if (r.status === 200) {
        const buf = await r.arrayBuffer();
        countUpdate(buf.byteLength);
        await applyUpdate(buf);
        showStats();
      } else if (r.status !== 204) {
        throw new Error('HTTP ' + r.status);
      }
    } catch (e) {
      if (e.name === 'AbortError') continue;   // the view changed: ask again right away
      hint(tr('noConnection'));
      await sleep(2000);
    }
  }
}

// ---- monitor switching: the button cycles through the PC monitors (and "all" at the end)
const monBtn = document.getElementById('monBtn');
let monitors = [], monitor = null;
function refreshMonitor() {
  monBtn.textContent = '🖥 ' + (monitor === 0 ? tr('allMonitors') : monitor);
  monBtn.style.display = monitors.length > 1 ? '' : 'none';
}
monBtn.onclick = async () => {
  const i = monitors.findIndex(m => m.index === monitor);
  const next = monitors[(i + 1) % monitors.length].index;
  try {
    const r = await fetch('monitor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: next }),
    });
    if (!r.ok) throw new Error();
    monitor = (await r.json()).monitor;
    refreshMonitor();
  } catch {
    hint(tr('monitorFailed'));
  }
};

fetch('info').then(r => r.json()).then(info => {
  monitors = info.monitors;
  if (monitor === null) monitor = info.monitor;
  refreshMonitor();
  captureName = info.capture;
  inputAllowed = info.input;
  if (!inputAllowed) {
    clicksOn = false;
    clicksBtn.style.display = 'none';
    kbBtn.style.display = 'none';
  }
}).catch(() => {});
frameLoop();

// ---- toolbar
clicksBtn.onclick = () => {
  clicksOn = !clicksOn;
  clicksBtn.classList.toggle('on', clicksOn);
};
document.getElementById('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};
document.getElementById('toggleBar').onclick = () =>
  document.getElementById('bar').classList.toggle('hidden');

// ---- pointer input
// One finger: tap = left click, long press = right click, drag = pan when zoomed in.
// Two fingers: pinch = zoom, vertical/horizontal move = mouse wheel on the PC.
const LONG_PRESS_MS = 550;
const MOVE_TOLERANCE = 12;
const SCROLL_STEP = 28;      // finger travel in CSS pixels per wheel notch
const pointers = new Map();  // pointerId -> {x, y}
let press = null;            // pending tap: {x, y, timer}
let pan = null;              // last position of the single finger
let gesture = null;          // two-finger gesture state
let panTimer = null;

function ripple(clientX, clientY, right) {
  const d = document.createElement('div');
  d.className = 'ripple' + (right ? ' right' : '');
  d.style.left = clientX + 'px';
  d.style.top = clientY + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 450);
}

function sendClick(clientX, clientY, button) {
  const p = toImageCoords(clientX, clientY);
  if (!p) return;
  ripple(clientX, clientY, button === 'right');
  fetch('click', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ x: p.x, y: p.y, button }),
  }).catch(() => hint(tr('clickFailed')));
}

// One scroll request at a time. Notches arriving meanwhile are merged into the next one,
// but only a few: on a slow link the rest is dropped rather than delivered as a jump later.
const SCROLL_PENDING_MAX = 6;
const scrollAcc = { p: null, dy: 0, dx: 0 };
let scrollBusy = false;
function sendScroll(p, dy, dx) {
  const cap = n => Math.max(-SCROLL_PENDING_MAX, Math.min(SCROLL_PENDING_MAX, n));
  scrollAcc.p = p;
  scrollAcc.dy = cap(scrollAcc.dy + dy);
  scrollAcc.dx = cap(scrollAcc.dx + dx);
  flushScroll();
}
async function flushScroll() {
  if (scrollBusy || !scrollAcc.p || (!scrollAcc.dy && !scrollAcc.dx)) return;
  scrollBusy = true;
  const body = { x: scrollAcc.p.x, y: scrollAcc.p.y,
                 dy: Math.max(-50, Math.min(50, scrollAcc.dy)), dx: Math.max(-50, Math.min(50, scrollAcc.dx)) };
  scrollAcc.dy = scrollAcc.dx = 0;
  try {
    const r = await fetch('scroll', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!r.ok) hint(tr('scrollFailed'));
  } catch {
    hint(tr('scrollFailed'));
  }
  scrollBusy = false;
  flushScroll();
}

function cancelPress() {
  if (press) clearTimeout(press.timer);
  press = null;
}
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

view.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { view.setPointerCapture(e.pointerId); } catch {}
  if (pointers.size === 2) {
    cancelPress();
    pan = null;
    const [a, b] = [...pointers.values()];
    const m = mid(a, b);
    gesture = { dist0: Math.hypot(a.x - b.x, a.y - b.y), mid0: m, lastMid: m, zoom0: zoom, tx0: tx, ty0: ty,
                mode: null, accY: 0, accX: 0, at: toImageCoords(m.x, m.y) };
    return;
  }
  if (pointers.size > 2) { gesture = null; return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pan = { x: e.clientX, y: e.clientY };
  if (clicksOn && inputAllowed) {
    const x = e.clientX, y = e.clientY;
    press = { x, y, timer: setTimeout(() => { sendClick(x, y, 'right'); press = null; }, LONG_PRESS_MS) };
  }
});

function handleGesture() {
  const g = gesture;
  const [a, b] = [...pointers.values()];
  const dist = Math.hypot(a.x - b.x, a.y - b.y), m = mid(a, b);
  if (!g.mode) {
    if (Math.abs(dist - g.dist0) > 25) g.mode = 'zoom';
    else if (Math.hypot(m.x - g.mid0.x, m.y - g.mid0.y) > 15) g.mode = 'scroll';
    else return;
  }
  if (g.mode === 'zoom') {
    const r = view.getBoundingClientRect();
    const z = Math.min(MAX_ZOOM, Math.max(1, g.zoom0 * dist / g.dist0));
    // The point that was under the fingers at the start stays under them.
    const sx = (g.mid0.x - r.left - g.tx0) / g.zoom0, sy = (g.mid0.y - r.top - g.ty0) / g.zoom0;
    zoom = z;
    tx = m.x - r.left - sx * z;
    ty = m.y - r.top - sy * z;
    applyTransform();
  } else {
    // Content follows the fingers: moving them down scrolls the PC window up.
    g.accY += m.y - g.lastMid.y;
    g.accX += m.x - g.lastMid.x;
    g.lastMid = m;
    const ny = Math.trunc(g.accY / SCROLL_STEP), nx = Math.trunc(g.accX / SCROLL_STEP);
    if ((ny || nx) && g.at && clicksOn && inputAllowed) {
      g.accY -= ny * SCROLL_STEP;
      g.accX -= nx * SCROLL_STEP;
      sendScroll(g.at, ny, -nx);
    }
  }
}
function endGesture() {
  gesture = null;
  if (zoom < 1.05) zoom = 1;
  applyTransform();
  viewChanged();
}

view.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  p.x = e.clientX;
  p.y = e.clientY;
  if (gesture) { if (pointers.size === 2) handleGesture(); return; }
  if (pointers.size !== 1 || !pan) return;
  const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
  pan.x = e.clientX;
  pan.y = e.clientY;
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > MOVE_TOLERANCE) cancelPress();
  if (!press && zoom > 1) {
    tx += dx;
    ty += dy;
    applyTransform();
    if (!panTimer) panTimer = setTimeout(() => { panTimer = null; viewChanged(); }, 150);
  }
});
view.addEventListener('pointerup', e => {
  pointers.delete(e.pointerId);
  if (gesture) { if (pointers.size < 2) endGesture(); return; }
  if (press) {
    const { x, y } = press;
    cancelPress();
    sendClick(x, y, 'left');
  }
  pan = null;
  viewChanged();
});
view.addEventListener('pointercancel', e => {
  pointers.delete(e.pointerId);
  cancelPress();
  pan = null;
  if (gesture && pointers.size < 2) endGesture();
});
view.addEventListener('contextmenu', e => {
  e.preventDefault();
  // Desktop browser: real right button goes straight through.
  if (clicksOn && inputAllowed && !('ontouchstart' in window)) sendClick(e.clientX, e.clientY, 'right');
});
view.addEventListener('wheel', e => {
  e.preventDefault();
  if (!clicksOn || !inputAllowed) return;
  const p = toImageCoords(e.clientX, e.clientY);
  if (!p) return;
  const unit = e.deltaMode === 0 ? 100 : 1;   // pixels or lines
  const notches = d => Math.sign(d) * Math.max(1, Math.round(Math.abs(d) / unit));
  sendScroll(p, e.deltaY ? -notches(e.deltaY) : 0, e.deltaX ? notches(e.deltaX) : 0);
}, { passive: false });
view.addEventListener('dragstart', e => e.preventDefault());

// ---- keyboard
const kb = document.getElementById('kb');
const kbInput = document.getElementById('kbInput');
kbInput.placeholder = tr('typeHere');
const PASTE_MIN = 100;

// Actions are batched and sent strictly one request at a time, so keystrokes never reorder.
let keyQueue = [];
let keyBusy = false;
function sendKeys(...actions) {
  keyQueue.push(...actions);
  flushKeys();
}
async function flushKeys() {
  if (keyBusy || !keyQueue.length) return;
  keyBusy = true;
  const actions = keyQueue;
  keyQueue = [];
  try {
    const r = await fetch('key', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actions }),
    });
    if (!r.ok) hint(tr('keysFailed'));
  } catch {
    hint(tr('keysFailed'));
  }
  keyBusy = false;
  flushKeys();
}

// Sticky modifiers: tap Ctrl, then a key -> Ctrl+key. Tapping an active modifier again sends it alone.
const mods = new Set();
const modButtons = [...kb.querySelectorAll('.mod')];
function refreshMods() {
  modButtons.forEach(b => b.classList.toggle('on', mods.has(b.dataset.mod)));
}
function takeMods() {
  const list = [...mods];
  mods.clear();
  refreshMods();
  return list;
}
modButtons.forEach(b => b.addEventListener('click', () => {
  const m = b.dataset.mod;
  if (mods.has(m)) {
    mods.delete(m);
    sendKeys({ key: m, mods: takeMods() });
  } else {
    mods.add(m);
    refreshMods();
  }
}));

kb.querySelectorAll('[data-key]').forEach(b => {
  // Keep focus in the text field so the phone keyboard does not close on every button tap.
  b.addEventListener('pointerdown', e => e.preventDefault());
  b.addEventListener('click', () => {
    const extra = b.dataset.mods ? b.dataset.mods.split(',') : [];
    sendKeys({ key: b.dataset.key, mods: [...new Set([...takeMods(), ...extra])] });
  });
});
modButtons.forEach(b => b.addEventListener('pointerdown', e => e.preventDefault()));

// Russian layout letters -> the Latin key at the same position, so Ctrl+С works like Ctrl+C.
const RU = 'йцукенгшщзхъфывапролджэячсмитьбю', EN = "qwertyuiop[]asdfghjkl;'zxcvbnm,.";
function comboKey(ch) {
  ch = ch.toLowerCase();
  const i = RU.indexOf(ch);
  if (i >= 0) ch = EN[i];
  return /^[a-z0-9]$/.test(ch) ? ch : null;
}

// The field always holds a sentinel space, so Backspace on an "empty" field is still visible
// as a deletion. Every change is diffed against the previous value and replayed on the PC,
// which also covers autocorrect and predictive text replacing whole words.
const SENTINEL = ' ';
let prevValue = SENTINEL;
function resetField() {
  kbInput.value = SENTINEL;
  prevValue = SENTINEL;
}
resetField();

kbInput.addEventListener('input', e => {
  const cur = kbInput.value;
  let start = 0;
  while (start < prevValue.length && start < cur.length && prevValue[start] === cur[start]) start++;
  let end = 0;
  while (end < prevValue.length - start && end < cur.length - start
         && prevValue[prevValue.length - 1 - end] === cur[cur.length - 1 - end]) end++;
  const removed = prevValue.length - start - end;
  const added = cur.slice(start, cur.length - end);
  prevValue = cur;

  const combo = mods.size && removed === 0 && added.length === 1 ? comboKey(added) : null;
  if (combo) {
    sendKeys({ key: combo, mods: takeMods() });
  } else {
    if (removed > 0) sendKeys({ key: 'backspace', repeat: Math.min(removed, 100) });
    // Keyboards' clipboard suggestions insert text without a paste event; long inserts go
    // through the PC clipboard too.
    if (added) sendKeys(e.inputType === 'insertFromPaste' || added.length > PASTE_MIN
      ? { paste: added } : { text: added });
  }
  if (!e.isComposing && (cur.length === 0 || cur.length > 200)) resetField();
});
kbInput.addEventListener('compositionend', () => {
  if (kbInput.value.length === 0) resetField();
});

// Keys that do not change the field text (and a physical keyboard on a desktop browser).
const PASS_KEYS = {
  Enter: 'enter', Tab: 'tab', Escape: 'esc', Delete: 'delete',
  ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
  Home: 'home', End: 'end', PageUp: 'pageup', PageDown: 'pagedown',
};
kbInput.addEventListener('keydown', e => {
  if (e.isComposing || e.keyCode === 229) return;
  const physMods = ['ctrl', 'alt', 'shift', 'win'].filter((m, i) =>
    [e.ctrlKey, e.altKey, e.shiftKey, e.metaKey][i]);
  let key = PASS_KEYS[e.key] || (/^F\d{1,2}$/.test(e.key) ? e.key.toLowerCase() : null);
  if (!key && (e.ctrlKey || e.altKey || e.metaKey) && e.key.length === 1) key = comboKey(e.key);
  if (!key) return;
  if (key === 'v' && (e.ctrlKey || e.metaKey) && !e.altKey) return;  // browser paste -> 'paste' event
  e.preventDefault();
  sendKeys({ key, mods: [...new Set([...takeMods(), ...physMods])] });
  if (key === 'enter') resetField();
});

// ---- paste from the phone: the text is put into the PC clipboard and pasted with Ctrl+V.
function pasteText(text) {
  if (!inputAllowed || !text) return;
  takeMods();
  sendKeys({ paste: text });
}
document.addEventListener('paste', e => {
  const text = e.clipboardData?.getData('text/plain');
  if (!text) return;
  e.preventDefault();
  pasteText(text);
});
const pasteBtn = document.getElementById('pastePhone');
pasteBtn.addEventListener('pointerdown', e => e.preventDefault());
pasteBtn.addEventListener('click', async () => {
  // Reading the clipboard directly works only over HTTPS; otherwise the phone's own
  // "Paste" in the text field does the same through the paste event above.
  if (navigator.clipboard?.readText) {
    try { pasteText(await navigator.clipboard.readText()); return; } catch {}
  }
  kbInput.focus();
  hint(tr('pasteHint'));
});

kbBtn.onclick = () => {
  const open = kb.classList.toggle('open');
  kbBtn.classList.toggle('on', open);
  if (open) { resetField(); kbInput.focus(); } else kbInput.blur();
};
</script>
</body>
</html>
